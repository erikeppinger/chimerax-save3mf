[build-system]
requires = ["ChimeraX-BundleBuilder"]
build-backend = "chimerax.bundle_builder.cx_pep517"

[project]
name = "ChimeraX-Save3MF"
version = "0.2.4"
description = "Save ChimeraX scenes as 3MF files for 3D printing, with colors carried through as painted extruders"
authors = [{ name = "Erik Eppinger" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "ChimeraX-Core ~=1.9",
    # chimerax.save_command is its own bundle, not part of Core
    "ChimeraX-SaveCommand ~=1.0",
    # registers the "data formats" manager this bundle provides 3MF to
    "ChimeraX-DataFormats ~=1.0",
]
dynamic = ["classifiers"]

[project.urls]
Repository = "https://github.com/erikeppinger/chimerax-save3mf"
Issues = "https://github.com/erikeppinger/chimerax-save3mf/issues"

[project.readme]
content-type = "text/markdown"
text = """
Adds 3MF to the formats ChimeraX can save, for 3D printing:

    save molecule.3mf size 80

The scene is written as it is displayed, and the colors you set up in ChimeraX
are carried through as painted extruders, so a multi-material slicer opens the
file with each chain or region already assigned to its own filament.

Also reports what a slicer will make of the geometry before you print it:
disconnected pieces, meshes that are not watertight, geometry sealed invisibly
inside other geometry, and how much print time each color costs. Large
prints are exported more finely than ChimeraX draws them on screen, so the flat
facets of cylinders and ribbons do not show in the print.

The help includes a worked example, from a PDB entry to a four-colour print,
with tips for each kind of model.

Developed with AI assistance (Claude); every format decision was verified
against PrusaSlicer, Bambu Studio and OrcaSlicer.
"""

[chimerax]
package = "chimerax.save3mf"
categories = ["Input/Output"]
min-session-version = 1
max-session-version = 1

[chimerax.extra-files]
"src/docs/user/commands" = ["docs/commands/*"]

[chimerax.command."3mf palette"]
category = "Input/Output"
synopsis = "Preview the color parts a 3MF export would produce"

[chimerax.data-format."3MF"]
category = "Generic 3D objects"
suffixes = ".3mf"
nicknames = "3mf"
encoding = "binary"
synopsis = "3D Manufacturing Format"
reference-url = "https://3mf.io/specification/"
save = true

# Linting only (tests/run_all.ps1 runs it when ruff is installed). No
# formatter: the code is formatted by hand, and reformatting would bury real
# changes in one large diff.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# pyflakes (undefined and unused names), syntax errors, flake8-bugbear
# (likely mistakes). Add a rule set only when it would have caught something
# real here.
select = ["F", "E9", "B"]
# zip() without strict=: every zip here runs over equal-length lists by
# construction, and strict=True would change behaviour without finding bugs
ignore = ["B905"]
